<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101827" />
  <title>Sign in · NOVA</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0,#30345d 0,transparent 45%),#0d1421;color:#e8edf8;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.card{width:min(100%,410px);padding:36px;border:1px solid #29364d;border-radius:22px;background:linear-gradient(145deg,#19263a,#131e2e);box-shadow:0 24px 80px #0005;text-align:center}.mark{width:54px;height:54px;margin:0 auto 17px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(145deg,#9b91ff,#655bd4);font-size:25px;box-shadow:0 8px 25px #776be544}.eyebrow{color:#a69cff;font-size:10px;font-weight:700;letter-spacing:2px}.card h1{margin:10px 0 8px;font-size:28px;letter-spacing:-1px}.card p{margin:0 auto 25px;max-width:290px;color:#98a6bb;font-size:13px;line-height:1.7}.google{width:100%;display:flex;justify-content:center;align-items:center;gap:11px;padding:13px 16px;border:1px solid #d5dbe5;border-radius:10px;background:#f7f8fb;color:#202938;font-size:13px;font-weight:700;cursor:pointer}.google:disabled{opacity:.65;cursor:wait}.google svg{width:18px;height:18px}.note{margin-top:20px!important;margin-bottom:0!important;font-size:10px!important;color:#71819a!important}.error{display:none;margin-top:16px;padding:10px;border:1px solid #75404b;border-radius:8px;background:#3b202b;color:#ffc1c8;font-size:11px;line-height:1.5}.foot{margin-top:24px;color:#64748b;font-size:9px;letter-spacing:.4px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">✦</div>
    <div class="eyebrow">YOUR PERSONAL SPACE</div>
    <h1>Welcome to NOVA</h1>
    <p>Sign in with an approved Google account to open your private workspace.</p>
    <button class="google" id="signIn">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.73 7.18l7.65 5.94c4.46-4.12 7.12-10.2 7.12-17.59z"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.75-4.59l-7.98-6.2A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.81l-7.65-5.94c-2.13 1.43-4.86 2.28-8.25 2.28-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
    <div class="error" id="error"></div>
    <p class="note">Access is limited to the Google accounts approved by the owner.</p>
    <div class="foot">NOVA · YOUR LIFE, REMEMBERED</div>
  </main>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    const supabase = createClient("__SUPABASE_URL__", "__SUPABASE_ANON_KEY__", {
      auth: { flowType: "pkce", autoRefreshToken: true, persistSession: true, detectSessionInUrl: true }
    });
    const button = document.getElementById("signIn");
    const errorBox = document.getElementById("error");
    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
      button.disabled = false;
      button.textContent = "Try Google sign-in again";
    }
    async function establishWorkerSession() {
      const { data, error } = await supabase.auth.getSession();
      if (error) throw error;
      if (!data.session) return false;
      const response = await fetch("/auth/session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          access_token: data.session.access_token,
          refresh_token: data.session.refresh_token
        })
      });
      if (!response.ok) {
        const result = await response.json().catch(() => ({}));
        await supabase.auth.signOut();
        throw new Error(result.error || "This account does not have access to NOVA.");
      }
      window.location.replace("/");
      return true;
    }
    button.addEventListener("click", async () => {
      button.disabled = true;
      errorBox.style.display = "none";
      const { error } = await supabase.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.origin + "/auth/callback" }
      });
      if (error) showError(error.message);
    });
    try {
      if (window.location.pathname === "/auth/callback" || window.location.search.includes("code=") || window.location.hash.includes("access_token")) {
        button.disabled = true;
        button.textContent = "Finishing secure sign-in…";
        const connected = await establishWorkerSession();
        if (!connected) showError("Google sign-in did not return a session. Please try again.");
      }
    } catch (error) {
      showError(error.message || "Sign-in could not be completed.");
    }
  </script>
</body>
</html>
